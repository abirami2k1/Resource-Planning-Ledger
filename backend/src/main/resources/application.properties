spring.application.name=rpl-backend
# Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}

# Either a full JDBC URL (docker-compose) or host/port/name pieces (Render's fromDatabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rpl}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:rpl_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:rpl_pass}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
